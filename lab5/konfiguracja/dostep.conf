# Wlasne reguly dostepu do zadan 1-3 wpisz ponizej.
# Sciezki Directory odnosza sie do systemu plikow kontenera.

# Zadanie 1 - brak listy plikow, ale znane pliki dalej dostepne
<Directory "/usr/local/apache2/htdocs/materialy">
    Options -Indexes
</Directory>

# Zadanie 1 - katalog calkowicie niedostepny przez HTTP
<Directory "/usr/local/apache2/htdocs/wewnetrzne">
    Require all denied
</Directory>

# Zadanie 2 - panel tylko dla zalogowanych (HTTP Basic)
<Directory "/usr/local/apache2/htdocs/panel">
    AuthType Basic
    AuthName "Laboratorium 5"
    AuthBasicProvider file
    AuthUserFile "/auth/uzytkownicy"
    Require valid-user
</Directory>

# Zadanie 3 - CGI za tym samym logowaniem co panel
<Directory "/usr/local/apache2/cgi-bin">
    AuthType Basic
    AuthName "Laboratorium 5"
    AuthBasicProvider file
    AuthUserFile "/auth/uzytkownicy"
    Require valid-user
</Directory>
